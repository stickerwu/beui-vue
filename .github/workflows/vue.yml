name: Vue package and docs
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: vue
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vue/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm docs:build
      - run: node scripts/verify-docs.mjs
      - run: tar -czf "$RUNNER_TEMP/vue-docs.tar.gz" -C docs/.vitepress/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: vue-docs
          path: ${{ runner.temp }}/vue-docs.tar.gz
          compression-level: 0
          if-no-files-found: error
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vue/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions/download-artifact@v4
        with:
          name: vue-docs
          path: ${{ runner.temp }}
      - run: |
          mkdir -p docs/.vitepress/dist
          tar -xzf "$RUNNER_TEMP/vue-docs.tar.gz" -C docs/.vitepress/dist
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - run: pnpm test:package
      - uses: actions/upload-artifact@v4
        with:
          name: vue-package
          path: vue/.artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
