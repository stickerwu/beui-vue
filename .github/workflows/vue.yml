name: Vue package and docs
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: vue
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vue/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: vue/docs/.vitepress/dist
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vue/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/beui-pages
      - run: mkdir -p docs/.vitepress/dist && tar -xf "$RUNNER_TEMP/beui-pages/artifact.tar" -C docs/.vitepress/dist
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - run: pnpm test:package
      - uses: actions/upload-artifact@v4
        with:
          name: vue-package
          path: vue/.artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
